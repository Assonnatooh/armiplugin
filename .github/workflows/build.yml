name: Compila ArmiPlugin

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il codice
        uses: actions/checkout@v4

      - name: Installa Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Compila con Maven
        run: mvn -B package --file pom.xml

      - name: Carica il jar compilato
        uses: actions/upload-artifact@v4
        with:
          name: ArmiPlugin-jar
          path: target/ArmiPlugin.jar
